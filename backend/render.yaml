services:
  - type: web
    name: wellwish-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # User will input their Gemini key inside Render settings dashboard
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
